name: Worker API quality

on:
  push:
    branches:
      - main
    paths:
      - "workers/api/**"
      - ".github/workflows/worker-api-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run check
