name: Schr AI Core quality

on:
  push:
    branches: [main]
    paths:
      - "workers/ai-core/**"
      - ".github/workflows/ai-core-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "workers/ai-core/**"
      - ".github/workflows/ai-core-check.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ai-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
